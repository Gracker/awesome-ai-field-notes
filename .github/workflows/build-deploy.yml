name: Validate & Generate Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate entries.json
        run: python3 scripts/validate-schema.py
      - name: Generate site files (mdbook src)
        run: python3 scripts/generate-site.py
