name: Refresh GitHub Stars

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00 (北京 10:00)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh stars
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: python3 scripts/refresh-stars.py
      - name: Regenerate site
        run: python3 scripts/generate-site.py
      - name: Commit and push
        run: |
          git config user.name "openclaw-bot"
          git config user.email "openclaw-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "[openclaw] update: weekly stars refresh" && git push)
